<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magical Blue Heart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--fg:#8cc4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#8cc4ff}}
:root[data-theme="dark"]{--bg:#000;--fg:#8cc4ff}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--fg);font:15px/1.4 system-ui,sans-serif;letter-spacing:.04em;pointer-events:none;animation:p 2.6s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.55}50%{opacity:.18}}
@media (prefers-reduced-motion:reduce){.hint{animation:none;opacity:.5}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">Tap the heart</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SHADES=['#3b82f6','#60a5fa','#93c5fd','#bfdbfe','#1d4ed8'];
const N=2600,FLOAT_COUNT=140,BURST_COUNT=140;
let W,H,DPR,cx,cy,S,py,pr,parts=[],buckets=[],floats=[],sparks=[];
let mode='idle',tMode=0,named=false;
try{document.fonts.load('40px "Great Vibes"')}catch(e){}

function layout(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(W*0.62/32,H*0.36/29);cx=W/2;cy=H*0.42;
  py=cy+14.5*S+S*3.2;pr=11*S;
  parts.forEach(p=>{p.hx=cx+p.ux*S;p.hy=cy+p.uy*S;if(mode==='idle'){p.x=p.hx;p.y=p.hy}});
}
function build(){
  for(let i=0;i<N;i++){
    const t=Math.random()*Math.PI*2;
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    const r=Math.random()<.3?.9+Math.random()*.1:Math.sqrt(Math.random());
    parts.push({ux:x*r,uy:2.5-r*(y+2.5),hx:0,hy:0,x:0,y:0,vx:0,vy:0,
      s:Math.random()*1.3+.6,c:(Math.random()*SHADES.length)|0,ph:Math.random()*6.28,d:Math.random(),delay:0});
  }
  for(let c=0;c<SHADES.length;c++)buckets.push(parts.filter(p=>p.c===c));
  for(let i=0;i<FLOAT_COUNT;i++)floats.push({x:Math.random(),y:Math.random(),v:.00004+Math.random()*.00012,s:Math.random()*1.5+.4,ph:Math.random()*6.28});
}
function startBurst(){
  mode='burst';tMode=performance.now();
  parts.forEach(p=>{p.vx=(Math.random()-.5)*2;p.vy=-Math.random()*2.5;p.delay=(17-p.uy)*10+Math.random()*180});
  for(let i=0;i<BURST_COUNT;i++){
    const a=Math.random()*6.283,sp=1+Math.random()*4;
    sparks.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,dec:.008+Math.random()*.012,c:(Math.random()*SHADES.length)|0});
  }
}
function step(now,dt){
  const k=dt/16.7,e=now-tMode;
  if(mode==='idle'&&e>4800)startBurst();
  if(mode==='burst'&&e>1900){mode='reform';tMode=now;named=true}
  else if(mode==='reform'&&e>2600){mode='idle';tMode=now}
  for(const p of parts){
    if(mode==='burst'){
      if(e<p.delay){p.vy-=0.02*k}
      else{
        let dx=cx-p.x,dy=py-p.y,d=Math.hypot(dx,dy)+30;
        const nx=dx/d,ny=dy/d;
        p.vx+=(nx*.55-ny*(.9+p.d*.5))*.42*k+Math.sin(now*.01+p.ph)*.05;
        p.vy+=(ny*.55+nx*(.9+p.d*.5))*.42*k;
        const sp=Math.hypot(p.vx,p.vy);if(sp>9){p.vx*=9/sp;p.vy*=9/sp}
        const dm=Math.pow(.975,k);p.vx*=dm;p.vy*=dm;
      }
    }else{
      const idle=mode==='idle';
      const tx=p.hx+(idle?Math.sin(now*.0015+p.ph)*1.3:0);
      const ty=p.hy+(idle?Math.cos(now*.0017+p.ph*1.3)*1.3:0);
      const ks=idle?.07:(.006+p.d*.012);
      p.vx+=(tx-p.x)*ks*k;p.vy+=(ty-p.y)*ks*k;
      const dm=Math.pow(idle?.78:.9,k);p.vx*=dm;p.vy*=dm;
    }
    p.x+=p.vx*k;p.y+=p.vy*k;
  }
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.vy+=.05*k;s.x+=s.vx*k;s.y+=s.vy*k;s.life-=s.dec*k;
    if(s.life<=0)sparks.splice(i,1);
  }
  for(const f of floats){f.y-=f.v*dt;if(f.y<-.02){f.y=1.02;f.x=Math.random()}}
}
function platform(now){
  const g=mode==='burst'?1.8:1+.35*Math.sin(now*.004);
  ctx.save();ctx.translate(cx,py);ctx.scale(1,.2);
  const gr=ctx.createRadialGradient(0,0,0,0,0,pr*1.6);
  gr.addColorStop(0,`rgba(140,230,255,${.3*g})`);
  gr.addColorStop(.5,`rgba(30,120,255,${.16*g})`);
  gr.addColorStop(1,'rgba(0,40,255,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,pr*1.6,0,6.283);ctx.fill();
  ctx.restore();
  ctx.lineWidth=2.6;ctx.strokeStyle=`rgba(150,225,255,${.28*g})`;
  ctx.beginPath();ctx.ellipse(cx,py,pr,pr*.2,0,0,6.283);ctx.stroke();
  ctx.lineWidth=1.2;ctx.strokeStyle=`rgba(190,240,255,${.22*g})`;
  ctx.beginPath();ctx.ellipse(cx,py,pr*.72,pr*.14,0,0,6.283);ctx.stroke();
}
function draw(now){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const halo=ctx.createRadialGradient(cx,cy,0,cx,cy,S*20);
  halo.addColorStop(0,'rgba(30,100,255,.05)');halo.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);
  platform(now);
  ctx.fillStyle='rgba(140,200,255,.55)';
  for(const f of floats){const s=f.s*(.7+.4*Math.sin(now*.003+f.ph));ctx.fillRect(f.x*W,f.y*H,s,s)}
  const moving=mode!=='idle';
  for(let c=0;c<buckets.length;c++){
    ctx.fillStyle=SHADES[c];
    for(const p of buckets[c]){
      const s=p.s*(.7+.5*Math.sin(now*.004+p.ph*3));
      ctx.fillRect(p.x,p.y,s,s);
    }
    if(moving){
      ctx.strokeStyle=SHADES[c];ctx.lineWidth=.9;ctx.beginPath();
      for(const p of buckets[c]){
        if(Math.abs(p.vx)+Math.abs(p.vy)<1.2)continue;
        ctx.moveTo(p.x-p.vx*2.2,p.y-p.vy*2.2);ctx.lineTo(p.x,p.y);
      }
      ctx.stroke();
    }
  }
  ctx.lineWidth=1.4;
  for(const s of sparks){
    ctx.strokeStyle=SHADES[s.c];ctx.globalAlpha=Math.max(s.life,0);
    ctx.beginPath();ctx.moveTo(s.x-s.vx*2,s.y-s.vy*2);ctx.lineTo(s.x,s.y);ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(named){
    const e=now-tMode;
    const a=mode==='idle'?1:mode==='reform'?Math.min(Math.max((e-900)/1400,0),1):Math.max(0,1-e/450);
    if(a>0){
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=a;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font=Math.round(S*8)+'px "Great Vibes",cursive';
      ctx.shadowColor='#3b82f6';ctx.shadowBlur=S*1.6;
      ctx.fillStyle='#e8f4ff';ctx.fillText('Rima',cx,cy+S*.5);
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
  }
}
let last=performance.now();
function loop(now){
  const dt=Math.min(now-last,40);last=now;
  step(now,dt);draw(now);requestAnimationFrame(loop);
}
build();layout();
addEventListener('resize',layout);
document.addEventListener('pointerdown',()=>{if(mode==='idle')startBurst()});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){tMode=Infinity}
requestAnimationFrame(loop);
</script>
</body>
  </html>
